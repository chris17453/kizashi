{{- if .Values.agentSchedulerRbac.create }}
{{- $name := .Values.agentSchedulerRbac.serviceAccountName | default (printf "%s-agent-scheduler" (include "kizashi.fullname" .)) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "kizashi.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-scheduler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "kizashi.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-scheduler
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "kizashi.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-scheduler
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
{{- end }}
