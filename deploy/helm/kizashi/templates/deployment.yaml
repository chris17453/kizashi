{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kizashi.fullname" $root }}-{{ $name }}
  labels:
    {{- include "kizashi.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "kizashi.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "kizashi.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      {{- if eq $name "agent-scheduler" }}
      serviceAccountName: {{ default (printf "%s-agent-scheduler" (include "kizashi.fullname" $root)) $root.Values.agentSchedulerRbac.serviceAccountName | quote }}
      {{- else if $svc.serviceAccountName }}
      serviceAccountName: {{ tpl (toString $svc.serviceAccountName) $root | quote }}
      {{- end }}
      {{- if $svc.runAsRoot }}
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      {{- else }}
      securityContext:
        runAsNonRoot: true
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.image.registry }}/{{ $svc.bin }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port | default 8080 }}
              protocol: TCP
            {{- range $svc.extraPorts }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: TCP
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "kizashi.secretName" $root }}
            - configMapRef:
                name: {{ include "kizashi.configMapName" $root }}
          {{- if $svc.env }}
          env:
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: {{ tpl (toString $value) $root | quote }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml ($svc.resources | default $root.Values.resources) | nindent 12 }}
          {{- if $svc.dockerSocket }}
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
          {{- end }}
      {{- if $svc.dockerSocket }}
      volumes:
        # Docker-socket access is retained only for services explicitly configured with
        # dockerSocket: true (the Kubernetes agent-scheduler path leaves it disabled).
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
      {{- end }}
---
{{- end }}
